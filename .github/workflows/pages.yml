# Intégration continue : tests unitaires à chaque push et pull request.
# Le site est publié par Cloudflare Pages (https://cv-en-ligne.pages.dev, dossier public/, branche main).
# Publication GitHub Pages en secours : uniquement à la demande (Actions → Run workflow), après activation de
# Settings → Pages → Source : « GitHub Actions ».
name: Tests et mise en ligne de secours (GitHub Pages)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publier:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploiement
        uses: actions/deploy-pages@v4
