# Déploiement automatique de CV en ligne (Cloudflare Pages) à chaque push sur main.
# Prérequis (une seule fois) : secret CLOUDFLARE_API_TOKEN (jeton « Cloudflare Pages : Modifier » + « D1 : Modifier »),
# le même que pour Devizo et My shop. La base D1 du site crée son schéma toute seule (functions/).
name: Déploiement production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b052ef72eb7bca73ee5f8a26be23f8d2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests unitaires
        run: npm test

      - name: Jeton Cloudflare valide ?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN manquant (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # Diagnostic sans jamais afficher le jeton : longueur, forme, et réponse de Cloudflare.
          t="$CLOUDFLARE_API_TOKEN"
          echo "Jeton : ${#t} caractères ; espaces ou retours à la ligne : $(printf '%s' "$t" | grep -c '[[:space:]]' || true)"
          u=$(curl -s -H "Authorization: Bearer $t" https://api.cloudflare.com/client/v4/user/tokens/verify)
          a=$(curl -s -H "Authorization: Bearer $t" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          echo "Vérification (jeton utilisateur) : $(echo "$u" | grep -o '"success":[a-z]*\|"status":"[a-z]*"\|"message":"[^"]*"' | paste -sd' ' -)"
          echo "Vérification (jeton de compte)   : $(echo "$a" | grep -o '"success":[a-z]*\|"status":"[a-z]*"\|"message":"[^"]*"' | paste -sd' ' -)"
          p=$(curl -s -H "Authorization: Bearer $t" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?per_page=5")
          echo "Accès aux projets Pages du compte : $(echo "$p" | grep -o '"success":[a-z]*\|"message":"[^"]*"\|"name":"[a-z0-9-]*"' | head -8 | paste -sd' ' -)"
          echo "$u$a" | grep -q '"status":"active"' || { echo "::error::Cloudflare ne reconnaît pas ce jeton comme actif : recopiez la VALEUR du jeton (environ 40 caractères), pas son nom."; exit 1; }
          echo "$p" | grep -q '"success":true' || { echo "::error::Jeton actif mais sans accès aux projets Pages de ce compte : ajoutez la permission « Cloudflare Pages : Edit » et le bon compte dans « Account Resources »."; exit 1; }

      # Depuis la racine du dépôt : sinon functions/ (l'API) ne serait pas envoyé.
      - name: Déploiement Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy public --project-name cv-en-ligne --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --pretty=%s)"

      - name: Vérification de la production
        run: |
          sleep 15
          version=$(grep -o "const VERSION = '[^']*'" public/sw.js)
          curl -sf https://cv.nexusmarket.sn/sw.js | grep -q "$version"
          curl -sf https://cv.nexusmarket.sn/.well-known/assetlinks.json | grep -q sn.nexusmarket.cv
          curl -sf https://cv.nexusmarket.sn/api/config > /dev/null
          echo "Production OK ($version)"
